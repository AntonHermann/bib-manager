[workspace]
resolver = "3"
members = [
    "crates/bib-core",
    "crates/bib-extract",
    "tools/extract-bench",
]
exclude = ["spikes/zed-coexist-ext", "docs/research/probes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
unicode-normalization = "0.1.25"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
sha2 = "0.11"
thiserror = "2.0"
pdf_oxide = "=0.3.78"
pdf-extract = "=0.12.0"
tempfile = "3.27"
