[workspace]
resolver = "3"
members = [
    "crates/bib-core",
    "crates/bib-cli",
    "crates/bib-extract",
    "tools/extract-bench",
    "spikes/lsp-coexist",
]
exclude = ["spikes/zed-coexist-ext", "docs/research/probes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
unicode-normalization = "0.1.25"
anyhow = "1.0"
biblatex = "0.12"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.11"
thiserror = "2.0"
pdf_oxide = "=0.3.78"
pdf-extract = "=0.12.0"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
tempfile = "3.27"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2.3"
ureq = { version = "3.4", features = ["json"] }
